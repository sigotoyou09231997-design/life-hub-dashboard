<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <!-- 前の版のHTMLがブラウザ(やService Workerの取り置き)に残ったまま新しい版が出ると、
         そのHTMLは、もう無いJSファイル(assets の中の、古い名前のついた index-….js)を読みに行く。読めなければ
         **画面は真っ白のまま、何の知らせも出ない** — 2026-09-06に実際に起きた
         (Vercelの「全部index.htmlに流す」設定が、無いファイルにもindex.htmlを返していたため、
         MIME違いで弾かれた。vercel.json 側も /assets/ を除いて404が返るように直してある)。
         この台本は、そうなった時だけ取り置きを捨てて1回だけ読み込み直す。読み込む物より先に
         置くこと(この位置)。sessionStorageの印で、直らない場合に繰り返さないようにしている。 -->
    <script>
      (function () {
        var KEY = "lifehub:stale-html-recovered";
        var recovering = false;
        function alreadyTried() {
          try {
            return !!sessionStorage.getItem(KEY);
          } catch (e) {
            return false;
          }
        }
        function recover(why) {
          if (recovering || alreadyTried()) return;
          recovering = true;
          try {
            sessionStorage.setItem(KEY, why);
          } catch (e) {}
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (list) {
                  return Promise.all(
                    list.map(function (registration) {
                      return registration.unregister();
                    }),
                  );
                })
                .catch(function () {}),
            );
          }
          if (window.caches) {
            jobs.push(
              caches
                .keys()
                .then(function (keys) {
                  return Promise.all(
                    keys.map(function (key) {
                      return caches.delete(key);
                    }),
                  );
                })
                .catch(function () {}),
            );
          }
          Promise.all(jobs).then(function () {
            location.reload();
          });
        }
        // 読み込みに失敗したJS。MIME違いで弾かれた場合もここに来る。
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target;
            if (el && el.tagName === "SCRIPT" && el.src) recover("script");
          },
          true,
        );
        // 何も起きないまま真っ白なとき(上に引っかからない止まり方)の受け皿。
        // 「セッション確認中」の空白は #root の中に要素があるので、ここには来ない。
        window.addEventListener("DOMContentLoaded", function () {
          window.setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount === 0) recover("blank");
          }, 10000);
        });
      })();
    </script>
    <!-- タブのアイコンはサイドバーのロゴ（黒地＋青緑の葉）。SVG を読めないブラウザは PNG を使う。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 数字用の文字(UI/UX 調査メモ 第4弾 B-1)。金額・時刻・件数の大きな数字だけを Manrope にする。
         text= で「数字と、金額・時刻に使う記号」だけに絞って読む(0-9 ¥ , . : + - − % / —。約5KB)。
         日本語はここに入っていないので、端末の文字(ヒラギノ)のまま。使う所は src/styles/numbers-empty.css。
         電波の無い所でも、一度読めば Service Worker の取り置きから出る(vite.config.ts の runtimeCaching)。
         一度も読めていない時は display=swap で端末の文字のまま出るだけで、見た目は崩れない。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap&amp;text=0123456789%C2%A5%2C.%3A%2B-%E2%88%92%25%2F%E2%80%94"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LIFE HUB" />
    <title>LIFE HUB</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
